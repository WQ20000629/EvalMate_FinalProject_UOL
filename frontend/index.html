<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Page title shown in browser tab -->
  <title>AI Interview Evaluator</title>

  <!-- Link to external CSS file for styling -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Screen 1: Job description input screen -->
  <div id="screen-jd" class="screen active">
    <h1>AI Interview Evaluator</h1>
    <p class="subtitle">Paste a job description to generate interview questions.</p>

    <!-- Textarea for user to paste the job description -->
    <textarea id="jd-input" placeholder="Paste job description here..." rows="10"></textarea>

    <!-- Interview settings: how many questions, and which types -->
    <div class="settings-box">
      <div class="settings-row">
        <label for="num-questions">Number of Questions</label>
        <select id="num-questions">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Question Types</label>
        <div class="type-checkboxes">
          <label><input type="checkbox" value="Behavioural" checked> Behavioural</label>
          <label><input type="checkbox" value="Situational" checked> Situational</label>
          <label><input type="checkbox" value="Motivational" checked> Motivational</label>
          <label><input type="checkbox" value="Technical" checked> Technical</label>
        </div>
      </div>
    </div>

    <!-- Button to generate interview questions -->
    <button id="btn-generate">Generate Questions</button>

    <!-- Error message area for job description input -->
    <p id="jd-error" class="error hidden"></p>
  </div>

  <!-- Screen 2: Interview screen -->
  <div id="screen-interview" class="screen hidden">
    <h1>AI Interview Evaluator</h1>

    <!-- Displays current question number, e.g. Question 1 of 3 -->
    <p id="question-counter" class="subtitle"></p>

    <!-- Displays the type of current question (e.g. Technical, Behavioural) -->
    <div id="question-type-box" class="type-box hidden"></div>

    <!-- Box showing the current interview question -->
    <div class="question-box">
      <p id="question-text"></p>
    </div>

    <!-- Webcam preview and live eye contact feedback -->
    <div id="cam-wrap" class="hidden">
      <video id="cam-feed" autoplay muted playsinline></video>
      <div id="gaze-badge" class="eye-live-badge">👁 Detecting...</div>
    </div>

    <!-- Audio recording controls -->
    <div class="recorder">
      <button id="btn-record">🎤 Start Recording</button>
      <span id="record-status"></span>
    </div>

    <!-- Transcript preview shown after recording is transcribed -->
    <div id="transcript-box" class="hidden">
      <p class="label">Transcript</p>
      <p id="transcript-text"></p>
    </div>

    <!-- Button to submit the transcribed answer for evaluation -->
    <button id="btn-submit-answer" class="hidden">Submit Answer</button>

    <!-- Error message area for interview step -->
    <p id="interview-error" class="error hidden"></p>
  </div>

  <!-- Screen 3: Final report screen -->
  <div id="screen-report" class="screen hidden">
    <h1>Final Report</h1>

    <!-- Summary section for overall interview results -->
    <div id="report-summary" class="summary-box"></div>

    <!-- Section for detailed per-question feedback -->
    <div id="report-questions"></div>

    <!-- Button to restart the full interview session -->
    <button id="btn-restart">Start Over</button>
  </div>

  <!-- Loading overlay shown while backend processing is happening -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <p id="loading-msg">Processing...</p>
  </div>

  <!-- MediaPipe helper for webcam handling -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <!-- MediaPipe FaceMesh library for face landmark / eye contact tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Main frontend JavaScript logic -->
  <script src="app.js"></script>
</body>
</html>
