# ------------------------------------------------------------------
# File: backend/alembic.ini
# Purpose: Settings Alembic uses to find the migrations and write its logs.
# ------------------------------------------------------------------

[alembic]
# Folder that holds env.py and the migration versions
script_location = %(here)s/alembic

# Add the backend folder to sys.path so the app package can be imported
prepend_sys_path = .

# Split path lists using the operating system's path separator
path_separator = os

# Placeholder URL, env.py replaces it with DATABASE_URL from backend/.env
sqlalchemy.url = driver://user:pass@localhost/dbname


# Logging settings read by env.py
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# Only show warnings from everything else
[logger_root]
level = WARNING
handlers = console
qualname =

# Hide the SQL statements SQLAlchemy runs
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Show which migrations Alembic runs
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Print log messages to the terminal
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
